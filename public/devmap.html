:root{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px;border-radius:6px}
button,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title b{font-family:var(--fd);font-weight:400;font-size:1.9rem;color:var(--brand);line-height:1}
.title span{color:var(--muted);font-size:.86rem}

.nav-item{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px;border-radius:9px;font-size:.88rem;cursor:pointer}

.mobile-pick{display:none}

.card h3{margin:0 0 10px;font-size:1rem;font-weight:900}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}

.proto-link{font-size:.85rem;margin-top:12px;display:inline-block}
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.log li:first-child{border-top:0;padding-top:0}

.log .res{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-size:.88rem;margin:0}
form.note{display:grid;gap:8px;margin-top:4px}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.form-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:4px 10px;font-size:.78rem;font-weight:500;border-radius:8px;cursor:pointer}
.status-msg{font-size:.8rem;color:var(--muted)}
.notes{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.notes li{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem;display:grid;gap:4px}
.notes .nh{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted)}

@media (max-width:860px){

  dev:["개봉 의약품·의약품 개인 간 거래 불가 → 알짜템(소장)으로만","입에 닿는 개봉 화장품은 나눔·중고 안 받음","법무 확인: Law in data + 자문단"],link:""},
 {g:"운영",id:"logo",n:"로고 · 11월 업무 타임라인",st:"plan",stage:"1R",
  what:"로고 개발과 11월까지 해야 할 일. 로고는 이름(고수템) 상표 확인 뒤 확정.",
  dev:["10/22 발대식·책임멘토 상견례 / 10/25 AI 솔루션 1개월차 신청","10/27 로고 브리프(키워드·색·쓰임) + 디자이너 공고 / 시드 가방 섭외 시작","11/2~11/8 첫 고수 5명 촬영 · 로고 시안 3안(외주 시 견적서·계약서, 50만 원 초과는 사전승인)","11/9~11/15 가방 10개 · 로고 확정 → 상표 출원(관납료·변리사 수수료는 카드 결제 가능)","11/16~11/22 초보 3명씩 피드백 / 11/23~11/27 실물 사진 넣고 시범 페이지 공개 · 11/25 AI 2개월차 신청","11/30 책임멘토링 2회 이상 완료·카드 사용 종료 / 12/1 13:00 활동보고서·사업계획서 제출"],link:""},
 {g:"운영",id:"name",n:"네이밍",st:"doing",stage:"1R",
  what:"가칭 '고수템 GOSUTEM'. 상표 조회·변리사 확인 전.",
  dev:["후보: 고수템, 갓템(GOATEM·GOTEM)","갓템은 흔한 말이라 식별력 약함"],link:""}
];
var byId={}; MENUS.forEach(function(m){byId[m.id]=m;});
var state={cur:null, notes:[], feedback:[], db:null, canWrite:true};
var side=document.getElementById("side"), detail=document.getElementById("detail"), pick=document.getElementById("pick");

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}); }
function countNotes(id){ return state.notes.filter(function(n){return n.menu===id}).length; }
function fmt(iso){ try{ var d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }catch(e){ return ""; } }

function renderSummary(){
  var c={done:0,doing:0,plan:0,hold:0}; MENUS.forEach(function(m){c[m.st]++});
  document.getElementById("summary").innerHTML=Object.keys(ST).map(function(k){return '<li><span style="color:'+ST[k].c+'">●</span> '+ST[k].n+' <b>'+c[k]+'</b></li>'}).join("")+
    '<li>피드백 로그 <b>'+state.feedback.length+'</b></li><li>주석 <b>'+state.notes.length+'</b></li>';
}
function renderNav(){
  var h='', g='';
  MENUS.forEach(function(m){
    if(m.g!==g){ g=m.g; h+='<div class="group">'+esc(g)+'</div>'; }
    var n=countNotes(m.id);
    h+='<div class="nav-row"><button type="button" class="nav-item" data-id="'+m.id+'" style="--sc:'+ST[m.st].c+'"'+(state.cur===m.id?' aria-current="true"':'')+'><span class="dot"></span><span class="nm">'+esc(m.n)+'</span><span class="cnt'+(n?' has':'')+'">'+n+'</span></button>'+
       '<button type="button" class="note-btn" data-note="'+m.id+'" aria-label="'+esc(m.n)+' 주석 달기" title="주석 달기"><svg><use href="#i-note"/></svg></button></div>';
  });
  side.innerHTML=h;
  side.querySelectorAll("[data-id]").forEach(function(b){ b.onclick=function(){ open(b.dataset.id,false); }; });
  side.querySelectorAll("[data-note]").forEach(function(b){ b.onclick=function(){ open(b.dataset.note,true); }; });
  pick.innerHTML=MENUS.map(function(m){ var n=countNotes(m.id); return '<option value="'+m.id+'"'+(state.cur===m.id?' selected':'')+'>['+m.g+'] '+esc(m.n)+(n?' · 주석 '+n:'')+'</option>'; }).join("");
}
function renderDetail(focusNote){
  var m=byId[state.cur]; if(!m) return;
  var prevTa=document.getElementById("noteText"), draft=prevTa&&prevTa.dataset.menu===m.id?prevTa.value:"", hadFocus=prevTa&&document.activeElement===prevTa;
  var fb=state.feedback.filter(function(f){return f.menu===m.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
  var ns=state.notes.filter(function(n){return n.menu===m.id}).sort(function(a,b){return (b.at||"").localeCompare(a.at||"")});
  var h='<section class="card" style="--sc:'+ST[m.st].c+'"><h2>'+esc(m.n)+'</h2><div class="meta"><span class="pill">'+ST[m.st].n+'</span><span class="pill" style="--sc:var(--muted)">'+esc(m.stage)+'</span><span class="pill" style="--sc:var(--muted)">'+esc(m.g)+'</span></div><p class="what">'+esc(m.what)+'</p>'+
    (m.link!==undefined?'<a class="proto-link" href="'+PROTO+m.link+'" target="_blank" rel="noopener">시범 앱에서 이 화면 보기 ↗</a>':'')+'</section>';
  h+='<section class="card"><h3>개발 메모</h3><ul class="dev">'+m.dev.map(function(d){return '<li>'+esc(d)+'</li>'}).join("")+'</ul></section>';
  h+='<section class="card"><h3>피드백 로그</h3>'+(fb.length?'<ul class="log">'+fb.map(function(f){return '<li><time>'+esc(f.date||"")+'</time><div>'+esc(f.text||"")+(f.result?'<span class="res">→ '+esc(f.result)+'</span>':'')+'</div></li>'}).join("")+'</ul>':'<p class="empty">'+(state.db?'아직 기록된 피드백이 없어요.':'피드백 로그를 불러오는 중이거나, 이 화면에서는 저장소를 쓸 수 없어요.')+'</p>')+'</section>';
  h+='<section class="card"><h3>주석</h3><form class="note" id="noteForm"><textarea id="noteText" placeholder="이 메뉴에 대한 생각, 바꿀 점, 질문을 남겨 주세요."></textarea><div class="form-row"><span class="status-msg" id="noteMsg">'+(state.db?(state.canWrite?'남긴 주석은 저장돼요.':'이 링크에서는 주석을 읽기만 할 수 있어요.'):'저장소에 연결 중이에요.')+'</span><button class="btn" id="noteBtn" type="submit"'+(state.db&&state.canWrite?'':' disabled')+'>주석 남기기</button></div></form>'+
    (ns.length?'<ul class="notes">'+ns.map(function(n){return '<li><div class="nh"><span>'+esc(fmt(n.at))+'</span>'+(state.canWrite?'<button type="button" class="btn-ghost" data-del="'+esc(n._id)+'">지우기</button>':'')+'</div><div class="tx">'+esc(n.text)+'</div></li>'}).join("")+'</ul>':'<p class="empty" style="margin-top:12px">아직 주석이 없어요.</p>')+'</section>';
  detail.innerHTML=h;
  var form=document.getElementById("noteForm"), ta=document.getElementById("noteText");
  ta.dataset.menu=m.id; if(draft) ta.value=draft; if(hadFocus) ta.focus();
  form.onsubmit=function(e){ e.preventDefault(); addNote(); };
  detail.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ delNote(b.dataset.del); }; });
  if(focusNote) document.getElementById("noteText").focus();
}
function open(id,focusNote){ if(!byId[id]) id=MENUS[0].id; state.cur=id; try{ if(location.hash!=="#"+id) history.replaceState(null,"","#"+id); }catch(e){} renderNav(); renderDetail(focusNote); }
pick.onchange=function(){ open(pick.value,false); };

async function addNote(){
  var ta=document.getElementById("noteText"), msg=document.getElementById("noteMsg"), btn=document.getElementById("noteBtn");
  var text=(ta.value||"").trim(); if(!text){ msg.textContent="내용을 먼저 적어 주세요."; return; }
  if(!state.db) return;
  btn.disabled=true; msg.textContent="저장 중…";
  try{ await state.db.collection("notes").add({menu:state.cur,text:text.slice(0,4000),at:new Date().toISOString()}); ta.value=""; msg.textContent="저장했어요."; }
  catch(e){ if(e&&e.code==="invalid_argument"){ state.canWrite=false; msg.textContent="이 링크에서는 주석을 남길 수 없어요."; } else if(e&&e.code==="quota_exceeded"){ msg.textContent="저장 공간이 가득 찼어요. 오래된 주석을 지워 주세요."; } else msg.textContent="저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
  finally{ btn.disabled=!state.canWrite; }
}
async function delNote(id){ if(!state.db) return; try{ await state.db.collection("notes").doc(id).delete(); }catch(e){} }

var first=(location.hash||"").replace("#","");
open(byId[first]?first:MENUS[0].id,false); renderSummary();

(async function(){
  try{
    var db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db){ renderDetail(false); return; }
    state.db=db;
    try{ var user=await window.claude.use("user"); if(user){ var c=await user.can("data.write"); if(c===false) state.canWrite=false; } }catch(e){}
    db.collection("notes").onSnapshot(function(snap){ state.notes=snap.docs.map(function(d){ var x=Object.assign({},d.data()); x._id=d.id; return x; }); renderSummary(); renderNav(); renderDetail(false); },function(){});
    db.collection("feedback").onSnapshot(function(snap){ state.feedback=snap.docs.map(function(d){ return Object.assign({},d.data()); }); renderSummary(); renderDetail(false); },function(){});
  }catch(e){ renderDetail(false); }
})();
})();
</script>
