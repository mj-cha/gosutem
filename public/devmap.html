header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}

.links{display:flex;flex-wrap:wrap;gap:6px}

.links a.main{background:var(--brand);color:var(--bg);border-color:var(--brand)}

.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0 0 14px;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.phases li{position:relative;padding:12px 14px 12px 16px;display:grid;gap:2px;border-right:1px solid var(--line);min-width:0}

.phases li[data-st="doing"]{background:color-mix(in srgb,var(--doing) 9%,var(--surface))}

.summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.76rem;color:var(--muted);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}

.week ul{list-style:none;margin:0;padding:4px 8px}
.week li button{width:100%;display:grid;grid-template-columns:62px 10px minmax(0,1fr) auto;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px;border-radius:9px;cursor:pointer;font-size:.88rem}

.week time{font-size:.78rem;color:var(--muted)}

.atag{font-size:.7rem;font-weight:800;color:var(--gc);white-space:nowrap}
.week .who{font-size:.72rem;color:var(--muted);margin-left:6px}

  var ta=$("noteText"); ta.dataset.item=it.id; if(draft) ta.value=draft; if(hadFocus) ta.focus();
  $("noteForm").onsubmit=function(ev){ ev.preventDefault(); addNote(); };
  $("detail").querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ delNote(b.dataset.del); }; });
  $("detail").querySelectorAll("[data-st]").forEach(function(b){ b.onclick=function(){ saveOver({st:b.dataset.st}); }; });
  $("dueIn").onchange=function(){ saveOver({due:this.value}); };
  $("owIn").onchange=function(){ saveOver({ow:this.value}); };
}
function renderAll(){ renderTop(); if(state.view==="flow") renderFlow(); else if(state.view==="sched") renderSched(); else { renderNav(); renderDetail(); } }
function setView(v,focus){
  state.view=v;
  document.querySelectorAll(".views [data-view]").forEach(function(b){ var on=b.dataset.view===v; b.setAttribute("aria-selected",String(on)); b.tabIndex=on?0:-1; if(on&&focus) b.focus(); });
  $("view-flow").hidden=v!=="flow"; $("view-sched").hidden=v!=="sched"; $("view-detail").hidden=v!=="detail";
  var tok=v==="detail"?state.item:v; try{ if(location.hash!=="#"+tok) history.replaceState(null,"","#"+tok); }catch(e){}
  renderAll();
}
function openItem(id){ if(!byId[id]) id=ITEMS[0].id; state.item=id; setView("detail"); window.scrollTo({top:document.querySelector(".views").offsetTop-8}); }
document.addEventListener("click",function(e){ var b=e.target.closest&&e.target.closest("[data-open]"); if(b) openItem(b.dataset.open); });
var vb=[].slice.call(document.querySelectorAll(".views [data-view]"));
vb.forEach(function(b,i){ b.onclick=function(){ if(b.dataset.view==="detail"&&!state.item) state.item=ITEMS[0].id; setView(b.dataset.view); };
  b.onkeydown=function(e){ var d={ArrowRight:1,ArrowLeft:-1}[e.key]; if(!d) return; e.preventDefault(); var n=vb[(i+d+vb.length)%vb.length]; if(n.dataset.view==="detail"&&!state.item) state.item=ITEMS[0].id; setView(n.dataset.view,true); }; });
$("pick").onchange=function(){ openItem(this.value); };

/* 저장소 쓰기 */
async function saveOver(patch){
  if(!state.db||!state.canWrite) return; var id=state.item, msg=$("editMsg");
  var cur=state.over[id]||{}, nx=Object.assign({},cur,patch,{at:new Date().toISOString()});
  state.over[id]=nx; renderAll(); msg=$("editMsg"); if(msg) msg.textContent="저장 중…";
  try{ await state.db.collection("status").doc(id).set(nx); var m=$("editMsg"); if(m) m.textContent="저장했어요."; }
  catch(e){ if(cur&&Object.keys(cur).length) state.over[id]=cur; else delete state.over[id]; if(e&&(e.code==="invalid_argument"||e.code==="permission_denied")) state.canWrite=false; renderAll(); var m2=$("editMsg"); if(m2) m2.textContent="저장하지 못했어요. 잠시 뒤 다시 해 주세요."; }
}
async function addNote(){
  var ta=$("noteText"), msg=$("noteMsg"), btn=$("noteBtn"), text=(ta.value||"").trim();
  if(!text){ msg.textContent="내용을 먼저 적어 주세요."; return; } if(!state.db) return;
  btn.disabled=true; msg.textContent="저장 중…";
  try{ await state.db.collection("notes").add({menu:state.item,text:text.slice(0,4000),at:new Date().toISOString()}); ta.value=""; msg.textContent="저장했어요."; }
  catch(e){ if(e&&e.code==="invalid_argument"){ state.canWrite=false; msg.textContent="이 링크에서는 주석을 남길 수 없어요."; } else if(e&&e.code==="quota_exceeded"){ msg.textContent="저장 공간이 가득 찼어요. 오래된 주석을 지워 주세요."; } else msg.textContent="저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
  finally{ btn.disabled=!state.canWrite; }
}
async function delNote(id){ if(!state.db) return; try{ await state.db.collection("notes").doc(id).delete(); }catch(e){} }

/* 첫 화면: #flow / #sched / #항목id */
var first=(location.hash||"").replace("#","");
if(byId[first]){ state.item=first; setView("detail"); } else setView(first==="sched"?"sched":"flow");

(async function(){
  try{
    var db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db){ renderAll(); return; }
    state.db=db;
    try{ var user=await window.claude.use("user"); if(user&&user.can){ var c=await user.can("data.write"); if(c===false) state.canWrite=false; } }catch(e){}
    db.collection("status").onSnapshot(function(snap){ var o={}; snap.docs.forEach(function(d){ if(d.exists) o[d.id]=d.data(); }); state.over=o; renderAll(); },function(){});
    db.collection("notes").onSnapshot(function(snap){ state.notes=snap.docs.map(function(d){ var x=Object.assign({},d.data()); x._id=d.id; return x; }); renderAll(); },function(){});
    db.collection("feedback").onSnapshot(function(snap){ state.feedback=snap.docs.map(function(d){ return Object.assign({},d.data()); }); renderAll(); },function(){});
  }catch(e){ renderAll(); }
})();
})();
</script>

</body></html>
